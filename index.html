<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#b7925d" />
  <title>Lazy Acres Ancestry · Globe Prototype</title>
  <meta name="description" content="A geometry prototype for exploring family history on an antique spherical family atlas." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="tree-mark" aria-hidden="true">♜</span><div><strong>Lazy Acres Ancestry</strong><span>family atlas prototype</span></div></div>
    <div class="search-shell">
      <label><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search the sample family…" autocomplete="off" /></label>
      <div id="searchResults" class="search-results" hidden></div>
    </div>
    <div class="history-line">Past lives.<br><strong>Still connected.</strong></div>
  </header>

  <main class="atlas-shell">
    <canvas id="globeCanvas" aria-label="Interactive spherical family tree"></canvas>
    <nav class="rail" aria-label="Prototype sections">
      <button class="active" type="button" data-action="home"><span>⌂</span>Home</button>
      <button type="button" data-action="search"><span>⌕</span>Search</button>
      <button type="button" data-action="people"><span>♙</span>People</button>
      <button type="button" data-action="places"><span>⌖</span>Places</button>
      <button type="button" data-action="stories"><span>▧</span>Stories</button>
      <button type="button" data-action="media"><span>▣</span>Media</button>
    </nav>
    <div class="source-pill" id="sourcePill">Loading…</div>
    <div class="scale-pill" id="scaleReadout"></div>
    <button class="home-person" id="homePersonBtn" type="button">⌂ Return to Tod</button>
    <div class="interaction-hint"><strong>Drag</strong> to rotate · <strong>Wheel</strong> to move closer/farther · <strong>Click</strong> a person</div>
    <div class="atlas-caption"><span>FAMILIES</span><span>ACROSS TIME</span></div>
  </main>

  <aside class="person-panel" id="personPanel" aria-live="polite"></aside>

  <script src="config.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
